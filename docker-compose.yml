# The whole application:   docker compose up --build   ->  http://localhost:8080
# Only the database (for local development with npm):   docker compose up -d postgres
name: school-management

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-school}:${POSTGRES_PASSWORD:-school}@postgres:5432/${POSTGRES_DB:-school_db}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    container_name: school-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school}
      POSTGRES_DB: ${POSTGRES_DB:-school_db}
    # Only reachable from this computer (for local development and DB tools).
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once: applies the migrations, then seeds the demo data if the database is empty.
  migrate:
    build:
      context: ./backend
      target: tools
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    # The same backend/.env as local development (AI keys and models). The
    # values under `environment` below win, so the container always talks to
    # the postgres service and runs in production mode.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *database-url
      JWT_SECRET: ${JWT_SECRET:-docker-demo-secret-change-me-0123456789abcdefghij}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
      # Behind nginx: rate limits use the real client IP.
      TRUST_PROXY: 1
      NODE_ENV: production
      PORT: 3000
    # The browser goes through nginx (port 8080). This port is only for API
    # tools on this computer: the API trusts nginx's X-Forwarded-For, so it
    # must not be reachable directly from other machines.
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
        # When the API is recreated (e.g. `docker compose up -d --build api`),
        # restart nginx too instead of leaving it stopped.
        restart: true

volumes:
  postgres-data:
