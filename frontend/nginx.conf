# Serves the React app and forwards /api to the API container.

# WebSocket upgrades (used by the chat) pass through; plain requests keep alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Photos of tests are uploaded through /api (up to 20 per scan).
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long-lived WebSocket connections
        proxy_read_timeout 1h;
    }

    # Vite puts a content hash in every file name, so these never change.
    location /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes (/admin/students, ...) all load index.html, which is
    # never cached so a new deployment is picked up right away.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
